project:
  name: multispectral-disease-detection

data:
  raw_dir: data/raw
  processed_dir: data/processed
  force_rebuild: false
  image_size: 128
  bands: [R, G, B, NIR]
  num_classes: 2
  train_size: 512
  val_size: 128
  train_ratio: 0.8
  split_seed: 42
  max_samples: null  # null = use every image in the manifest

train:
  batch_size: 64
  epochs: 40
  lr: 0.001
  weight_decay: 0.0001
  patience: 5
  seed: 42
  device: auto

model:
  type: transfer  # transfer | multibranch | cnn
  rgb_channels: 3
  nir_channels: 1
  hidden_dim: 256
